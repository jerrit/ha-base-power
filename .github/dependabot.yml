version: 2
updates:
  # Versions of the actions used in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Test dependencies in requirements_test.txt, including the pinned
  # Home Assistant version the tests run against.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      test-tools:
        patterns: ["pytest*", "ruff"]
