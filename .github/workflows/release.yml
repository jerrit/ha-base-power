name: Release

# Push a tag like v1.13.2 to publish a release. A tag with a dash, such as
# v1.13.2-beta.1, becomes a pre-release that only beta users see.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check manifest version matches the tag
        run: |
          tag="${GITHUB_REF_NAME}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/base_power/manifest.json'))['version'])")
          if [ "v${manifest}" != "${tag}" ]; then
            echo "::error::Tag ${tag} does not match manifest.json version ${manifest}"
            exit 1
          fi
      - name: Check release notes exist
        run: |
          notes="RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if [ ! -f "${notes}" ]; then
            echo "::error::Missing ${notes}"
            exit 1
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists, nothing to do."
            exit 0
          fi
          flags=()
          case "${tag}" in *-*) flags+=(--prerelease) ;; esac
          gh release create "${tag}" --title "${tag}" --notes-file "RELEASE_NOTES_${tag}.md" --verify-tag "${flags[@]}"
