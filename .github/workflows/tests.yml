name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.ha }} Home Assistant)
    runs-on: ubuntu-latest
    # The newest Home Assistant is an early warning. It never blocks a merge
    # or a release.
    continue-on-error: ${{ matrix.ha == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        ha: [pinned, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Upgrade to the newest Home Assistant
        if: matrix.ha == 'latest'
        run: pip install --upgrade homeassistant
      - name: Show Home Assistant version
        run: python -c "from homeassistant.const import __version__; print('Home Assistant', __version__)"
      - name: Run tests
        run: python -m pytest -q tests
      - name: Lint (report only)
        if: matrix.ha == 'pinned'
        run: ruff check custom_components --output-format=concise --exit-zero
