[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["*_test.py", "test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components/base_power"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PERF", "RUF"]
# E501: long lines are left to judgement.
# SIM108: an if/else that reads clearly is not forced into one line.
ignore = ["E501", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
